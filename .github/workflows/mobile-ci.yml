name: Mobile checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:all
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: trackademic-bundles
          path: dist-release
          retention-days: 7
